# Docs + marketing site for the reference instance.
#
# Pure static site (Astro Starlight). No `main` JS — Workers Assets serves
# `dist/` directly. The only thing this Worker does is take ownership of the
# apex catch-all route.
#
# Route specificity: this `<apex>/*` pattern is more specific than the web
# Worker's `*<apex>/*`, so apex requests land here UNLESS a narrower web
# route (e.g. `<apex>/u/*`) matches first.
#
# Committed file uses example.org placeholders for local dev. Real deploys
# use `wrangler.generated.toml`, produced by `pnpm render-wrangler`.

name = "bulletinmail-docs"
compatibility_date = "2026-05-01"

routes = [
  { pattern = "example.org/*", zone_name = "example.org" }
]

[assets]
directory = "./dist"
not_found_handling = "404-page"

[observability]
enabled = true
