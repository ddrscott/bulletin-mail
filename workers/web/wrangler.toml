# Web Worker — handles ALL HTTP traffic for the instance.
#
# Following the same single-Worker / wildcard-route pattern as relaytty.com:
# one Worker, one route pattern, host-based dispatch inside the handler.
# Covers:
#   - apex landing + legal + robots/llms.txt
#   - /u/:token             (one-click unsubscribe, RFC 8058)
#   - /g/:tenant/:group     (archive viewer, Phase 2)
#   - /api/bounce-events    (Email Service webhook)
#   - app.<apex>/*          (admin app + admin-api, Phase 2)
#   - <tenant>.<apex>/*     (per-tenant archive, Phase 2)
#
# Inbound (email) and sender (queue) stay as separate Workers because they
# aren't HTTP — Email Routing and Queue invoke them directly.
#
# This file is committed for local dev with example.org placeholders. For real
# deployment, run `pnpm render-wrangler --instance <your-apex>` to emit
# wrangler.generated.toml with the actual route pattern and zone.

name = "bulletinmail-web"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# Routing:
#  - `*.<apex>/*` (DOT-prefix wildcard) covers admin + every tenant subdomain
#    but deliberately does NOT match the bare apex — that belongs to the
#    docs Worker (`apps/docs/`).
#  - Narrower apex-only routes for the paths this Worker still owns on apex
#    (RFC 8058 unsubscribe, archive, apex API, health). Cloudflare picks the
#    most-specific (= longest character count) matching route, so these
#    apex paths beat the docs catch-all.
routes = [
  { pattern = "example.org/u/*", zone_name = "example.org" },
  { pattern = "example.org/c/*", zone_name = "example.org" },
  { pattern = "example.org/g/*", zone_name = "example.org" },
  { pattern = "example.org/api/*", zone_name = "example.org" },
  { pattern = "example.org/health", zone_name = "example.org" },
  { pattern = "*.example.org/*", zone_name = "example.org" }
]

[[d1_databases]]
binding = "DB"
database_name = "bulletinmail"
database_id = "PLACEHOLDER_LOCAL_DEV"

# Admin app static assets — apps/admin/dist (HTML + bundled JS + CSS).
# Build with `pnpm --filter @bulletinmail/admin build` before deploying.
#
# `run_worker_first = true` is critical: without it Workers Assets serves
# files BEFORE the Worker runs, so e.g. tenant subdomains hitting `/` would
# get the admin index.html instead of the wiki home page. With it, the Hono
# handler dispatches every request and explicitly falls through to
# env.ASSETS.fetch() inside mountAdmin (only on the admin host).
[assets]
directory = "../../apps/admin/dist"
binding = "ASSETS"
run_worker_first = true

# Magic-link sign-in emails are sent from this Worker (transactional, one-off).
# Same Cloudflare Email Service authorization as the sender Worker — outbound
# From must be on the apex (PRD §17 #6).
[[send_email]]
name = "EMAIL"

# Per-tenant wiki. One Durable Object instance per tenant (sharded by
# idFromName(tenant.slug)). Each DO carries its own SQLite database for pages
# + version history, keeping wiki data isolated per tenant. Mirrors the
# ../editor SpaceRoom pattern. Compiled HTML lives in R2 (`WIKI_R2`) so
# public reads don't touch the DO.
[[durable_objects.bindings]]
name = "WIKI"
class_name = "TenantWikiDO"

[[migrations]]
tag = "v1-wiki"
new_sqlite_classes = ["TenantWikiDO"]

[[r2_buckets]]
binding = "WIKI_R2"
bucket_name = "bulletinmail-wiki"

[observability]
enabled = true

[vars]
INSTANCE_APEX_DOMAIN = "example.org"
INSTANCE_ADMIN_DOMAIN = "app.example.org"
INSTANCE_PRODUCT_NAME = "Example Lists"
INSTANCE_PRODUCT_NAME_SHORT = "Lists"
INSTANCE_TAGLINE = "Mailing lists for our organization"
INSTANCE_ARCHIVE_URL = "https://example.org/g/{tenant}/{group}"
INSTANCE_UNSUB_URL = "https://example.org/u/{token}"
INSTANCE_ADMIN_URL = "https://app.example.org"
INSTANCE_OPERATOR_LEGAL_NAME = "Example Org"
INSTANCE_OPERATOR_MAILING_ADDRESS = "123 Main St, Anytown, US 00000"
INSTANCE_OPERATOR_CONTACT_URL = "https://example.org/contact"
