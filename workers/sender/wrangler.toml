# Sender Worker — Queue consumer. See workers/inbound/wrangler.toml for the
# committed-vs-generated explanation.

name = "bulletinmail-sender"
main = "src/index.ts"
compatibility_date = "2026-05-01"

[[d1_databases]]
binding = "DB"
database_name = "bulletinmail"
database_id = "PLACEHOLDER_LOCAL_DEV"

[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "bulletinmail-attachments"

[[queues.consumers]]
queue = "bulletinmail-send"
max_batch_size = 10
max_concurrency = 10
max_retries = 3
dead_letter_queue = "bulletinmail-send-dlq"

[[send_email]]
name = "EMAIL"

# Cron schedules (the handler dispatches on the expression — keep these in
# sync with the constants in src/):
#   "0 14 * * *" — daily moderator digest (pending subscription requests).
#     14:00 UTC = 09:00 ET / 06:00 PT, lands before the workday.
#   "0 23 * * SUN" — weekly member digest (list + wiki activity recap).
#     Sunday 23:00 UTC = Sunday evening US (18:00 ET / 15:00 PT). Must match
#     WEEKLY_DIGEST_CRON in src/weekly-digest.ts. (Cloudflare's cron parser
#     rejects 0 as day-of-week — its range is 1-7 / SUN-SAT, so use the name.)
[triggers]
crons = ["0 14 * * *", "0 23 * * SUN"]

# Cross-script binding to the web Worker's per-tenant wiki DO — the weekly
# digest reads recent wiki activity through it. `script_name` is the web
# Worker's constant name (see root wrangler.toml), so deploy the web Worker
# BEFORE the sender on a fresh install. At runtime the binding is optional:
# if the DO is unreachable (or this block is removed) the digest still
# sends, minus the wiki section.
[[durable_objects.bindings]]
name = "WIKI"
class_name = "TenantWikiDO"
script_name = "bulletinmail-web"

[observability]
enabled = true

[vars]
INSTANCE_APEX_DOMAIN = "example.org"
INSTANCE_ADMIN_DOMAIN = "app.example.org"
INSTANCE_PRODUCT_NAME = "Example Lists"
INSTANCE_PRODUCT_NAME_SHORT = "Lists"
INSTANCE_TAGLINE = "Mailing lists for our organization"
INSTANCE_ARCHIVE_URL = "https://example.org/g/{tenant}/{group}"
INSTANCE_UNSUB_URL = "https://example.org/u/{token}"
INSTANCE_ADMIN_URL = "https://app.example.org"
INSTANCE_OPERATOR_LEGAL_NAME = "Example Org"
INSTANCE_OPERATOR_MAILING_ADDRESS = "123 Main St, Anytown, US 00000"
INSTANCE_OPERATOR_CONTACT_URL = "https://example.org/contact"
