name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version is inferred from `packageManager` in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check-instance-leakage

  dco:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check DCO sign-off on every commit
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          MISSING=$(git log --invert-grep --grep='^Signed-off-by:' --format='%h %s' "$BASE_SHA..$HEAD_SHA" || true)
          if [ -n "$MISSING" ]; then
            echo "::error::Some commits are missing DCO sign-off:"
            echo "$MISSING"
            echo "Use 'git commit -s' (or 'git rebase --signoff') and force-push."
            exit 1
          fi
